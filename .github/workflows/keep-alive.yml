name: Keep Supabase alive

# The free-tier project pauses after 7 days without database activity.
#
# Two things went wrong with the previous version of this workflow and both are
# addressed here:
#
#   1. It pinged /rest/v1/ (the PostgREST root), not a table. Run a real select
#      so the ping counts as database activity.
#   2. GitHub disables *scheduled* workflows after 60 days without repository
#      activity — which is exactly the situation a low-traffic hobby repo ends
#      up in. The keepalive-commit job below pushes an empty commit to the
#      `keepalive` branch to keep the schedule armed. Treat this as a backstop:
#      an external cron (cron-job.org / UptimeRobot) hitting the same URL does
#      not depend on repo activity at all.

on:
  schedule:
    # Every other day at 06:00 UTC — leaves several days of margin inside the
    # 7-day pause window, since GitHub's scheduled runs can be delayed by hours.
    - cron: '0 6 */2 * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Query profiles
        run: |
          BODY=$(mktemp)
          STATUS=$(curl -sS -o "$BODY" -w '%{http_code}' --max-time 30 \
            "${{ secrets.VITE_SUPABASE_URL }}/rest/v1/profiles?select=id&limit=1" \
            -H "apikey: ${{ secrets.VITE_SUPABASE_ANON_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.VITE_SUPABASE_ANON_KEY }}")
          echo "HTTP $STATUS"
          echo "Response: $(head -c 500 "$BODY")"
          # 000 = could not connect / DNS gone; 540 = project paused.
          if [ "$STATUS" != "200" ]; then
            echo "::error::Supabase ping failed with status $STATUS — check the project in the Supabase dashboard"
            exit 1
          fi

  keepalive-commit:
    # Keeps the cron schedule from being auto-disabled after 60 idle days.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Push empty commit if the repo has been quiet
        run: |
          LAST=$(git log -1 --format=%ct)
          AGE_DAYS=$(( ( $(date +%s) - LAST ) / 86400 ))
          echo "Days since last commit on ${{ github.ref_name }}: $AGE_DAYS"
          if [ "$AGE_DAYS" -lt 45 ]; then
            echo "Repo is active enough; nothing to do."
            exit 0
          fi
          git config user.name  'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git checkout -B keepalive
          git commit --allow-empty -m "chore: keepalive ping $(date -u +%F)"
          git push --force origin keepalive
